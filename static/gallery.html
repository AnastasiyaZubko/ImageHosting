<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link rel="stylesheet" href="/static/image-uploader/css/reset.css" />
  <link rel="stylesheet" href="/static/image-uploader/css/style.css" />
  <style>
    .gallery-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 18px;
    }
    .gallery-card {
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }
    .gallery-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .gallery-meta { padding: 10px 12px; font-size: 14px; }
    .gallery-meta a { word-break: break-all; }
    .gallery-toolbar { display:flex; align-items:center; justify-content:space-between; gap: 10px; }
    .gallery-pager a { text-decoration:none; padding: 6px 10px; border: 1px solid rgba(0,0,0,.12); border-radius: 8px; }
    .gallery-pager a.disabled { pointer-events:none; opacity:.4; }
  </style>
</head>
<body>
  <nav class="upload__tabs">
    <button class="upload__tab" id="upload-tab-btn">Upload</button>
    <button class="upload__tab upload__tab--active" id="gallery-tab-btn">Gallery</button>
    <button class="upload__tab" id="images-tab-btn">Images</button>
</nav>
  <div class="gallery-wrap">
    <div class="gallery-toolbar">
      <h2>Gallery</h2>
      <div class="gallery-pager">
        <a id="prev" href="#">Prev</a>
        <span style="margin: 0 8px;">Page <b id="page">1</b></span>
        <a id="next" href="#">Next</a>
      </div>
    </div>
    <div id="grid" class="gallery-grid"></div>
    <div id="empty" style="display:none; margin-top: 18px;">Нет изображений.</div>
  </div>
  <script src="/static/image-uploader/js/gallery.js"></script>
</body>
</html>
